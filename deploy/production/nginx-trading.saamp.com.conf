server {
    listen 80;
    listen [::]:80;
    server_name trading.saamp.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trading.saamp.com;

    ssl_certificate /etc/letsencrypt/live/trading.saamp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trading.saamp.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 1m;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # [À COMPLÉTER] Replace this directory only after a reviewed front-build audit.
    root /__FRONT_ROOT_A_COMPLETER__;
    index index.html;

    # Santé destinée au reverse proxy et à l'exploitation locale, jamais exposée publiquement.
    location = /trading-api/actuator/health {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
    }

    location ^~ /trading-api/actuator/ {
        deny all;
    }

    location ^~ /trading-api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # The static SPA fallback is intentionally outside /trading-api/.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
